app = "nutrition-boop"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3456"
  NODE_ENV = "production"
  PUBLIC_URL = "https://nutrition-boop.fly.dev"
  SENDBLUE_AUTO_WEBHOOK = "false"

[http_service]
  internal_port = 3456
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
